spring:
  application:
    name: shortener-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

cloud:
  aws:
    region:
      static: ${AWS_REGION}
    sqs:
      endpoint: ${AWS_CUSTOM_ENDPOINT}
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}